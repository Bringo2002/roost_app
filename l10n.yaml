arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
# Generate a real, importable Dart package file rather than relying on the
# deprecated synthetic `package:flutter_gen` output -- this keeps the
