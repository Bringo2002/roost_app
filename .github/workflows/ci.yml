name: CI

# Quality gate for every pull request and for main. Runs static analysis and
# the unit/widget test suite so a red check blocks the merge instead of
# surfacing after it. (The iOS build lives in ios_build.yml and is unchanged.)
on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to the same PR supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    # Pinned so a runner-image migration (ubuntu-latest moves to Ubuntu 26
    # from 2026-10-19) cannot change CI underneath us. Bump it deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Also generates the gitignored l10n sources (pubspec `generate: true`).
      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

  # Fails a pull request whose commits carry AI attribution trailers, which
  # CLAUDE.md prohibits. Once pushed, such commits stay reachable through
  # refs/pull/* and only GitHub Support can purge them, so catch them here.
  commit-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so BASE..HEAD can be walked.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reject AI attribution trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-commit-trailers.sh "$BASE_SHA" "$HEAD_SHA"
