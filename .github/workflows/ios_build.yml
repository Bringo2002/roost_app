name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Flutter and iOS dependencies
        run: |
          flutter precache --ios
          flutter pub get
          flutter build ios --release --no-codesign --config-only

      - name: Compile iOS App with Xcode (Bypass Code Signing)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/ios \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Package IPA
        run: |
          cd build/ios/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r roost_app_ios.ipa Payload

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roost-app-ios
          path: build/ios/Build/Products/Release-iphoneos/roost_app_ios.ipa
